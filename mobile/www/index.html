<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PermitField OS</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, system-ui, sans-serif; background: #fafafa; color: #18181b; text-align: center; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 15px; color: #52525b; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; color: #fff; background: #18181b; border: 0; border-radius: 8px; padding: 10px 18px; }
</style>
</head>
<body>
  <!-- Shown only when the app can't reach www.permitfieldos.com (the app
       loads the live site; see capacitor.config.ts). -->
  <main>
    <h1>PermitField OS</h1>
    <p>You're offline, or PermitField can't be reached right now.</p>
    <button onclick="location.href='https://www.permitfieldos.com/applications'">Try again</button>
  </main>
</body>
</html>
