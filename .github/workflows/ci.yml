# Lifecycle & Compliance Expansion, Phase 1.1 follow-up (B2): this repo's
# first CI workflow. PHASE_0_FINDINGS.md's original audit ("CI: NOT FOUND.
# No .github/ directory exists at repo root") and every later phase report
# flagged this as a standing gap -- lint/build/tests were all documented as
# manually-run commands, with nothing catching a regression automatically.
# This file closes that gap for good, rather than relying on a human
# remembering to run `npm test`/`npm run test:sql` before every commit.
#
# Two independent jobs, deliberately not chained:
#   - build-and-test: lint + build + vitest. Needs nothing but Node -- no
#     Docker, no secrets, no external services. This is the fast, always-on
#     safety net (see lib/authz/permissions-doc.test.ts and friends).
#   - sql-tests: boots a real local Supabase Postgres stack via the
#     Supabase CLI (same `supabase start` / `supabase db reset` steps
#     documented in every supabase/tests/*.test.sql file's own "HOW TO RUN"
#     header) and runs scripts/run-sql-tests.sh (`npm run test:sql`)
#     against it. This is the heavier job -- real Docker containers, full
#     migration replay, seed data -- but it is what finally makes the
#     tenant-isolation / composite-FK / atomicity proofs in
#     supabase/tests/ run on every push instead of "written but not
#     executed in this environment," which is what every one of those
#     files' header comments has said since Phase 1.0.
#
#     This job also boots a second, independent local Postgres stack for
#     supabase-client-portal/ (Gate 2.0's second Supabase project) via
#     `supabase --workdir supabase-client-portal` and runs
#     scripts/run-client-portal-sql-tests.sh (`npm run test:sql:client-portal`)
#     against it. Both stacks run in the same job, on the same runner,
#     concurrently -- safe because supabase-client-portal/supabase/config.toml
#     offsets every port +100 from the root project's, specifically so this
#     works without collision (see that file's header). Before this, PR #6's
#     CI reported green having never executed
#     supabase-client-portal/supabase/tests/client_portal_token_lifecycle.test.sql
#     at all -- the sql-tests job only ever globbed supabase/tests/*.test.sql.
#     Both scripts fail loud (non-zero, before running anything) if their
#     respective test glob comes back empty, so a silently-empty or
#     silently-skipped suite cannot report green.
#
#     Gate 2.0 sub-phase 2.4 adds a third step to this job, `npm run
#     test:live` (lib/bridge/client-portal.live.test.ts), run last -- after
#     both SQL suites, never before, since it commits fixture rows into
#     project 1 that the SQL suites' clean-slate assumptions don't expect
#     (see that test file's own header for the failure this ordering fixes).
#     It exercises the client-portal bridge layer's five read operations
#     against both real local stacks together, the one thing neither SQL
#     suite alone can prove (each only ever talks to its own project).
#
# Kept as two jobs (not one) so a Postgres/Docker flake in sql-tests never
# blocks the fast, infra-free build-and-test signal from reporting -- and
# vice versa.
name: CI

# Quoted "on" (not bare) -- bare `on:` is parsed as the boolean `true` by
# YAML 1.1 (a well-known footgun; GitHub's own workflow parser special-cases
# it correctly either way, but quoting removes any ambiguity for every other
# YAML tool/linter that touches this file).
"on":
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

  sql-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # scripts/run-sql-tests.sh (npm run test:sql) itself only needs
      # bash/psql/the supabase CLI, but `npm ci` here keeps this job
      # self-contained rather than depending on build-and-test's cache.
      - run: npm ci

      # Official Supabase CLI installer -- installs the native binary
      # directly (not through the npm wrapper devDependency), which is the
      # documented pattern for CI per Supabase's own GitHub Actions guide.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` requires Docker, which ubuntu-latest runners
      # provide out of the box -- this is the step that was impossible in
      # the sandbox every prior phase report/self-check ran in (no Docker
      # there; see PHASE_0_FINDINGS.md SS1). It applies every migration in
      # supabase/migrations/ to a fresh local Postgres instance.
      - run: supabase start

      # Re-applies migrations from a clean slate and loads supabase/seed.sql
      # -- the fixture data every supabase/tests/*.test.sql file's org
      # A/org B/role rows depend on.
      - run: supabase db reset

      - run: npm run test:sql

      # Second, independent stack for supabase-client-portal/ (Gate 2.0's
      # second Supabase project). `--workdir` points the CLI at
      # supabase-client-portal/supabase/config.toml instead of the
      # repo-root project's -- the CLI only discovers a project's config
      # at <workdir>/supabase/config.toml, which is why this file lives
      # under supabase-client-portal/supabase/ and not directly in
      # supabase-client-portal/ (see that migration's history for why).
      # Runs concurrently with the stack started above; config.toml's own
      # +100 port offset is what makes that safe.
      - run: supabase --workdir supabase-client-portal start

      - run: supabase --workdir supabase-client-portal db reset

      - run: npm run test:sql:client-portal

      # Gate 2.0 sub-phase 2.4: the bridge module's own live-Supabase tests
      # (lib/bridge/client-portal.live.test.ts) against both stacks started
      # above. MUST run after both `npm run test:sql` and
      # `npm run test:sql:client-portal`, never before -- this suite commits
      # a fixture row into project 1's application_documents that it cannot
      # delete (no DELETE grant for service_role there by design; see that
      # test file's own header), which was caught breaking two of
      # supabase/tests/*.test.sql's own clean-slate row-count assumptions
      # when run first during 2.4's own local verification. The credentials
      # below are the Supabase CLI's fixed, publicly documented local-dev
      # demo keys -- identical for every local project regardless of port,
      # not secrets -- matching the same values already committed in
      # .env.local's own comment ("standard local demo keys").
      - run: npm run test:live
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          CLIENT_PORTAL_SUPABASE_URL: http://127.0.0.1:54421
          CLIENT_PORTAL_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      # Best-effort cleanup; the runner is thrown away after the job
      # regardless, but this documents intent and avoids leaving a
      # container running if this job is ever moved to a persistent runner.
      - if: always()
        run: supabase stop --no-backup

      - if: always()
        run: supabase --workdir supabase-client-portal stop --no-backup
